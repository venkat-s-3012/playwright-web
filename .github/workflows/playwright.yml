name: Playwright Tests
on:
  push:
    branches: [ main, master, 'feature/**' ]
  pull_request:
    branches: [ main, master ]

  workflow_dispatch:
    inputs:
      environment:
        description: Select environment
        required: true
        type: choice
        options:
          - qa
          - prod
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'qa' }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Azure login
      uses: azure/login@v3
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }}
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps

    - name: Create environment file
      env:
        TEST_ENV: ${{ inputs.environment || 'qa' }}
        BASE_URL: ${{ secrets.BASE_URL }}
        API_BASE_URL: ${{ secrets.API_BASE_URL }}
        USERNAME: ${{ secrets.USERNAME }}
        PASSWORD: ${{ secrets.PASSWORD }}
      run: |
        echo "BASE_URL=${BASE_URL}" >> .env.${TEST_ENV}
        echo "API_BASE_URL=${API_BASE_URL}" >> .env.${TEST_ENV}
        echo "USERNAME=${USERNAME}" >> .env.${TEST_ENV}
        echo "PASSWORD=${PASSWORD}" >> .env.${TEST_ENV}
        
    - name: Run Playwright tests
      env:
        PLAYWRIGHT_SERVICE_URL: ${{ vars.PLAYWRIGHT_SERVICE_URL }}
        TEST_ENV: ${{ inputs.environment || 'qa' }}
      run:  npx playwright test --grep '@smoke' --config=playwright.service.config.ts --workers=5
      
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
